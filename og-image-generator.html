<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; background: #333; height: 100vh; }
        .og-container {
            width: 1200px; height: 630px; /* 標準 OG 圖片尺寸 */
            background: linear-gradient(135deg, #1a0b2e, #4a1c6e, #2a0845);
            position: relative; overflow: hidden;
            font-family: 'Montserrat', sans-serif; color: white;
            display: flex; align-items: center; justify-content: center;
        }
        /* 極光背景 */
        .og-container::before {
            content: ''; position: absolute; inset: -50%;
            background: radial-gradient(circle at 30% 70%, rgba(212,165,255,0.4) 0%, transparent 60%),
                        radial-gradient(circle at 70% 30%, rgba(100,200,255,0.3) 0%, transparent 60%);
            filter: blur(80px); z-index: 1;
        }
        /* 中央的大球體 */
        .orb {
            width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #d4a5ff);
            box-shadow: 0 0 80px rgba(212, 165, 255, 0.6), inset 0 0 40px rgba(255,255,255,0.8);
            position: absolute; right: 150px; z-index: 2;
        }
        /* 波紋 */
        .wave {
            position: absolute; right: 150px; width: 350px; height: 350px;
            border-radius: 50%; border: 4px solid rgba(212, 165, 255, 0.5);
            transform: scale(1.4); z-index: 1;
        }
        .wave2 { transform: scale(1.9); border: 2px dashed rgba(212, 165, 255, 0.3); }
        
        .text-content { position: absolute; left: 100px; z-index: 5; text-align: left; max-width: 600px;}
        .title { 
            font-size: 110px; font-weight: 900; margin: 0; line-height: 1;
            background: linear-gradient(to right, #fff, #f5cdfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5); font-family: 'Syne', sans-serif; letter-spacing: 5px;
        }
        .subtitle { font-size: 35px; letter-spacing: 15px; margin-top: 20px; color: rgba(255,255,255,0.7); }
        .badge {
            display: inline-block; padding: 10px 25px; border-radius: 12px;
            font-size: 24px; font-weight: bold; margin-top: 40px;
            border: 2px solid #ff75c3; color: #ff75c3; background: rgba(255,117,195,0.1);
            box-shadow: 0 0 20px rgba(255,117,195,0.4); text-transform: uppercase;
        }
        /* 裝飾粒子 */
        .sparkle { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px 5px #fff; z-index: 3;}
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Syne:wght@800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="og-container">
        <div class="sparkle" style="top: 100px; left: 200px;"></div>
        <div class="sparkle" style="top: 500px; left: 600px; transform: scale(0.5);"></div>
        <div class="sparkle" style="top: 200px; right: 100px; transform: scale(1.5);"></div>
        <div class="text-content">
            <h1 class="title">PiXXiE</h1>
            <div class="subtitle">VOICE RESONANCE</div>
            <div class="badge">Discover Your Soul Match</div>
        </div>
        <div class="wave wave2"></div>
        <div class="wave"></div>
        <div class="orb"></div>
    </div>
</body>
</html>
